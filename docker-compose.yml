version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gamify-hc-backend
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=sqlite:////app/backend/database/gamify_hc.db
      - FLASK_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      # Persist database between container restarts
      - ./backend/database:/app/backend/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://backend:5001/api
    container_name: gamify-hc-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "echo '🔷📣🔷 OPEN THE APP AT: http://localhost:3000' &&
            echo '🔷📣🔷 Backend API: http://localhost:5001/api' &&
            nginx -g 'daemon off;'"