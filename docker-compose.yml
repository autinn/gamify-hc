version: '3.8'

# Environment variables are loaded from .env file (see .env.example)
# Copy .env.example to .env and customize as needed:
#   cp .env.example .env
#
# Docker Compose automatically reads .env from the project root for variable substitution

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamify-hc-postgres
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: gamify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamify_secret}
      POSTGRES_DB: gamify_hc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamify -d gamify_hc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gamify-hc-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "${FLASK_PORT:-5001}:5001"
    environment:
      # Database URL uses Docker service name 'postgres' as host (not localhost)
      - DATABASE_URL=postgresql://gamify:${POSTGRES_PASSWORD:-gamify_secret}@postgres:5432/gamify_hc
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - SQLALCHEMY_ECHO=${SQLALCHEMY_ECHO:-False}
      - SQLALCHEMY_POOL_SIZE=${SQLALCHEMY_POOL_SIZE:-10}
      - SQLALCHEMY_MAX_OVERFLOW=${SQLALCHEMY_MAX_OVERFLOW:-20}
      - SQLALCHEMY_POOL_PRE_PING=${SQLALCHEMY_POOL_PRE_PING:-True}
      - SQLALCHEMY_POOL_RECYCLE=${SQLALCHEMY_POOL_RECYCLE:-300}
      - AUTO_SEED_DATABASE=${AUTO_SEED_DATABASE:-True}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5001/api}
    container_name: gamify-hc-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "echo '🔷📣🔷 OPEN THE APP AT: http://localhost:3000' &&
            echo '🔷📣🔷 Backend API: http://localhost:5001/api' &&
            echo '🔷📣🔷 Backend API Swagger Docs: http://localhost:5001/api/docs' &&

            nginx -g 'daemon off;'"

volumes:
  postgres_data:
