
# IMPORTANT: .env file is REQUIRED, please see README.md for more information.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamify-hc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gamify-hc-backend
    ports:
      - "${FLASK_PORT}:5001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - SQLALCHEMY_ECHO=${SQLALCHEMY_ECHO}
      - SQLALCHEMY_POOL_SIZE=${SQLALCHEMY_POOL_SIZE}
      - SQLALCHEMY_MAX_OVERFLOW=${SQLALCHEMY_MAX_OVERFLOW}
      - SQLALCHEMY_POOL_PRE_PING=${SQLALCHEMY_POOL_PRE_PING}
      - SQLALCHEMY_POOL_RECYCLE=${SQLALCHEMY_POOL_RECYCLE}
      - AUTO_SEED_DATABASE=${AUTO_SEED_DATABASE}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    container_name: gamify-hc-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "echo '🔷📣🔷 OPEN THE APP AT: http://localhost:3000' &&
            echo '🔷📣🔷 Backend API: http://localhost:5001/api' &&
            echo '🔷📣🔷 Backend API Swagger Docs: http://localhost:5001/api/docs' &&

            nginx -g 'daemon off;'"

volumes:
  postgres_data:
